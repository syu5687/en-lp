<VirtualHost *:8080>
	ServerAdmin info@en1150.co.jp
	DocumentRoot /var/www/html

	# Cloud Run は内部で 8080 を待ち受けるため、Apache が自動生成するリダイレクト先URL
	# （末尾スラッシュ補完など）に :8080 が混入し、http://en1150.co.jp:8080/... という
	# 外部から到達できないURLへ飛んでしまう。公開ホスト名を正規名として使い、
	# 物理ポートを付けないよう明示する。
	ServerName en1150.co.jp
	UseCanonicalName On
	UseCanonicalPhysicalPort Off

	<Directory /var/www/html>
		Options Indexes FollowSymLinks
		AllowOverride All
		Require all granted
	</Directory>

	# 各LPディレクトリのindexを優先
	DirectoryIndex index.php index.html

	# ログを Cloud Run の標準出力/エラーに流す
	ErrorLog /dev/stderr
	CustomLog /dev/stdout combined
</VirtualHost>
