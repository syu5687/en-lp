<VirtualHost *:8080>
	ServerAdmin info@en1150.co.jp
	DocumentRoot /var/www/html

	<Directory /var/www/html>
		Options Indexes FollowSymLinks
		AllowOverride All
		Require all granted
	</Directory>

	# 各LPディレクトリのindexを優先
	DirectoryIndex index.html index.php

	# ログを Cloud Run の標準出力/エラーに流す
	ErrorLog /dev/stderr
	CustomLog /dev/stdout combined
</VirtualHost>
